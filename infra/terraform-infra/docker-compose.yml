version: '3.8'

services:
  floci:
    image: floci/floci:latest
    container_name: floci-floci
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ec2,iam,s3,rds,elasticache,eks,sts,cloudformation,logs,kms
      - DEBUG=1
      - DATA_DIR=/tmp/floci/data
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "${TMPDIR:-.}/floci:/tmp/floci"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - floci-network
    healthcheck:
      test: ["CMD", "awslocal", "kinesis", "list-streams"]
      interval: 5s
      timeout: 5s
      retries: 5

  floci-ui:
    image: floci/floci-ui:latest
    container_name: floci-ui-floci
    ports:
      - "4500:4500"
    environment:
      - FLOCI_HOSTNAME=floci
      - FLOCI_API_ENDPOINT=http://floci:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_ENDPOINT=http://floci:4566
    depends_on:
      - floci
    networks:
      - floci-network

networks:
  floci-network:
    driver: bridge
